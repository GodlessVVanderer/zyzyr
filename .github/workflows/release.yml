name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libzstd.so
            src: target/x86_64-unknown-linux-gnu/release/libzyzyr.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libzstd-x86_64.dylib
            src: target/x86_64-apple-darwin/release/libzyzyr.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libzstd-aarch64.dylib
            src: target/aarch64-apple-darwin/release/libzyzyr.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zstd.dll
            src: target/x86_64-pc-windows-msvc/release/zyzyr.dll

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo rustc --release --target ${{ matrix.target }} --features compat --crate-type cdylib

      - run: cp "${{ matrix.src }}" "${{ matrix.artifact }}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libzstd.so
            libzstd-x86_64.dylib
            libzstd-aarch64.dylib
            zstd.dll
