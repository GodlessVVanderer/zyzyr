[package]
name = "zyzyr"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ZYZYR: a Zstandard (RFC 8878) decompressor in pure Rust with no dependencies; no_std + alloc core, optional C API."
repository = "https://github.com/GodlessVVanderer/zyzyr"
keywords = ["zstd", "zstandard", "compression", "decompression", "no-std"]
categories = ["compression", "no-std"]
publish = true

[lib]
name = "zyzyr"

[features]
default = ["std"]
std = []
capi = []
compat = ["capi"]

[dependencies]

[dev-dependencies]
zstd = "0.14"

[[test]]
name = "capi"
required-features = ["capi"]

[[test]]
name = "compat"
required-features = ["compat"]

[lints.clippy]
missing_safety_doc = "allow"
too_many_arguments = "allow"

[package.metadata.capi]
header = "include/zyzyr.h"
staticlib = "cargo rustc -p zyzyr --release --features capi --crate-type staticlib"
cdylib = "cargo rustc -p zyzyr --release --features capi --crate-type cdylib"
